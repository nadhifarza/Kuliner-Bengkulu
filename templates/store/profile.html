{% extends 'store/base.html' %}{% block title %}Profil Saya{% endblock %}{% block content %}<div class="narrow"><div class="breadcrumb">Akun / Profil Saya</div><h1>Profil Saya</h1><form method="post" class="panel">{% csrf_token %}<label>Nama lengkap<input name="first_name" value="{{ user.first_name }}" required></label><label>Email<input value="{{ user.email }}" disabled><small class="hint">Penggantian email memerlukan verifikasi email baru.</small></label><label>Ganti email<input type="email" name="new_email" placeholder="alamat-email-baru@example.com"><small class="hint">Isi email baru lalu pilih tombol di bawah untuk mengirim tautan verifikasi.</small></label><label>Nomor telepon<input name="phone" value="{{ user.phone }}"></label><button class="btn btn-primary" formaction="{% url 'profile' %}">Simpan Profil</button><button class="btn btn-soft" formaction="{% url 'change_email' %}">Kirim Verifikasi Email Baru</button></form><div class="account-links"><a href="{% url 'addresses' %}">Kelola Alamat →</a><a href="{% url 'password_change' %}">Ubah Password →</a><a href="{% url 'notifications' %}">Pusat Notifikasi →</a></div></div>{% endblock %}
